[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretary"
version = "1.0.0"
description = "ИИ-секретарь созвонов: Telegram-бот, стенограммы с диаризацией, саммари, решения и задачи"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.7",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.8",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "python-docx>=1.1",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
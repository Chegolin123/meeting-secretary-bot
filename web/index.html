<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ИИ-секретарь — кабинет</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1c1e21; }
    header { background: #1c1e21; color: #fff; padding: 16px 24px; }
    header b { font-size: 18px; }
    main { max-width: 900px; margin: 24px auto; padding: 0 16px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; margin-right: 6px; }
    .done { background: #e3f5e9; color: #0a7a33; }
    .error { background: #fde8e8; color: #b42318; }
    .other { background: #e8edf2; color: #556070; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eceff3; font-size: 14px; }
    th { background: #f0f2f5; }
    .empty { color: #8a94a6; padding: 24px; text-align: center; }
    .hint { color: #8a94a6; font-size: 13px; margin: 12px 0; }
  </style>
</head>
<body>
<header><b>🎙 ИИ-секретарь созвонов</b> — кабинет <span id="ver" style="opacity:.6">v2.0 (scaffold)</span></header>
<main>
  <div class="hint">Фундамент self-service-кабинета (дорожная карта v2.0.0): история заказов, дальше — оплата, пакеты, экспорт.</div>
  <table>
    <thead><tr><th>#</th><th>Статус</th><th>Провайдер</th><th>Длительность</th><th>Создан</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>Заказов пока нет — пришли боту первый созвон.</div>
</main>
<script>
async function load() {
  const res = await fetch('/api/orders?limit=50');
  const orders = await res.json();
  const tbody = document.getElementById('rows');
  const empty = document.getElementById('empty');
  tbody.innerHTML = '';
  if (!orders.length) { empty.hidden = false; return; }
  empty.hidden = true;
  for (const o of orders) {
    const cls = o.status === 'done' ? 'done' : (o.status === 'error' ? 'error' : 'other');
    const dur = o.audio_duration_sec ? Math.round(o.audio_duration_sec / 60) + ' мин' : '—';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>#${o.id}</td><td><span class="badge ${cls}">${o.status}</span></td>
      <td>${o.provider || '—'}</td><td>${dur}</td><td>${(o.created_at || '').slice(0, 19).replace('T', ' ')}</td>`;
    tbody.appendChild(tr);
  }
}
load();
</script>
</body>
</html>
